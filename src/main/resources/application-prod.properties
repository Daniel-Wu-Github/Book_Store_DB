# Production configuration for Heroku deployment

# --- Datasource (MySQL via Heroku addon like JawsDB or ClearDB) ---
# Heroku provides DATABASE_URL in format: mysql://user:pass@host:port/database
# We parse it into Spring-compatible format using environment variables
spring.datasource.url=${JDBC_DATABASE_URL:}
spring.datasource.username=${JDBC_DATABASE_USERNAME:}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}

# Connection pool settings for Heroku's limited connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Hibernate / JPA behavior
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Seed data on first run
app.seed.enabled=${APP_SEED_ENABLED:true}

# --- JWT / Security ---
jwt.secret=${JWT_SECRET:change-this-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- CORS for frontend ---
# Allow requests from your Vercel frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Server
server.port=${PORT:8080}
